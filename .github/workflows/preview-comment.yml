name: Comment Preview URL

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  post-preview-comment:
    name: Post Preview Comment
    if: >-
      contains(github.event.check_run.name, 'docsite-preview') &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post or update preview link comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const checkRunPayload = context.payload.check_run;

            // Fetch the full check run details to ensure we have output text
            const checkRun = (await github.rest.checks.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkRunPayload.id,
            })).data;

            const text = checkRun.output?.text || '';
            const urlMatch =
              text.match(/Channel URL \([^)]+\):\s*(https:\/\/[^\s\]]+)/) ||
              text.match(/(https:\/\/genkit-dev-astro--pr-[a-zA-Z0-9-]+\.web\.app)/);

            if (!urlMatch) {
              console.log('No preview channel URL found in check run output.');
              return;
            }

            const previewUrl = urlMatch[1];
            console.log(`Found preview URL: ${previewUrl}`);

            // Find associated PR number
            let prNumber = null;
            if (checkRunPayload.pull_requests && checkRunPayload.pull_requests.length > 0) {
              prNumber = checkRunPayload.pull_requests[0].number;
            } else {
              const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: checkRunPayload.head_sha,
              });
              if (pulls.data && pulls.data.length > 0) {
                prNumber = pulls.data[0].number;
              }
            }

            if (!prNumber) {
              console.log(`Could not find a pull request associated with commit ${checkRunPayload.head_sha}`);
              return;
            }

            const commentTag = '<!-- genkit-preview-url-comment -->';
            const commentBody = [
              commentTag,
              '### 🚀 Docsite Preview Deployed',
              '',
              'A preview build has been deployed and is ready for review:',
              '',
              `- 🔗 **Preview URL:** [${previewUrl}](${previewUrl})`,
              '',
              '---',
              `*Built from commit \`${checkRunPayload.head_sha.substring(0, 7)}\`.*`,
            ].join('\n');

            // Find existing comment to update rather than creating duplicates on each push
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(
              (c) => c.body && c.body.includes(commentTag)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              console.log(`Updated preview comment on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
              console.log(`Created preview comment on PR #${prNumber}`);
            }
